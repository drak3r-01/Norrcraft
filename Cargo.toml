[workspace]
resolver = "2"
members = [
    "crates/nb-core",
    "crates/nb-data",
    "crates/nb-world",
    "crates/nb-mesh",
    "crates/nb-ecs",
    "crates/nb-gfx",
    "crates/nb-ui",
    "crates/nb-game",
    "crates/nb-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
# Maths / ECS / sérialisation
glam = { version = "0.29", features = ["serde"] }
hecs = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# Concurrence
crossbeam-channel = "0.5"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
# Fenêtre / GPU (utilisés à partir de la phase 4)
winit = "0.30"
ash = "0.38"
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }

# Crates internes
nb-core = { path = "crates/nb-core" }
nb-data = { path = "crates/nb-data" }
nb-world = { path = "crates/nb-world" }
nb-mesh = { path = "crates/nb-mesh" }
nb-ecs = { path = "crates/nb-ecs" }
nb-gfx = { path = "crates/nb-gfx" }
nb-ui = { path = "crates/nb-ui" }
nb-game = { path = "crates/nb-game" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
