[package]
name = "nb-gfx"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["window"]
# Fenêtre winit + surface/swapchain. Sans cette feature, seul le rendu hors écran est compilé.
window = ["dep:winit", "dep:ash-window", "dep:raw-window-handle"]

[dependencies]
nb-core.workspace = true
nb-anim.workspace = true
nb-data.workspace = true
# Sommets, culling (quadtree + frustum), caméra JOML et contour de bloc : nb-mesh est pur CPU
# (ne dépend que de nb-core / nb-data), nb-gfx ne voit toujours pas nb-world.
nb-mesh.workspace = true
nb-particles.workspace = true
glam.workspace = true
bytemuck.workspace = true
image.workspace = true
thiserror.workspace = true
ash.workspace = true
gpu-allocator.workspace = true
winit = { workspace = true, optional = true }
# Absents de [workspace.dependencies] : déclarés ici pour ne modifier que ce crate.
ash-window = { version = "0.13", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[dev-dependencies]
sha2 = "0.10"

[lints]
workspace = true

[[example]]
name = "viewer"
required-features = ["window"]
