name: Build

# Pipeline de build : Windows, Linux et macOS (x86_64 + arm64). Déclenchée UNIQUEMENT par un tag
# de version (ou manuellement) ; une release GitHub est créée pour chaque tag :
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   name: Norrblock-windows-x64,   exe: norrblock.exe, ext: zip }
          - { os: windows-11-arm,   name: Norrblock-windows-arm64, exe: norrblock.exe, ext: zip }
          - { os: ubuntu-latest,    name: Norrblock-linux-x64,     exe: norrblock,     ext: tar.gz }
          - { os: ubuntu-24.04-arm, name: Norrblock-linux-arm64,   exe: norrblock,     ext: tar.gz }
          - { os: macos-latest,     name: Norrblock-macos-arm64,   exe: norrblock,     ext: tar.gz }
          - { os: macos-15-intel,   name: Norrblock-macos-x64,     exe: norrblock,     ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk
          echo "NB_MOLTENVK=$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" >> "$GITHUB_ENV"
      # Les shaders SPIR-V sont versionnés (crates/nb-gfx/shaders/spv) : pas besoin de glslc.
      - name: Build release
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --locked --release -p nb-app
      - name: Package
        shell: bash
        run: sh scripts/package.sh target/release/${{ matrix.exe }} dist/Norrblock
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/Norrblock
          if-no-files-found: error
      - name: Archive (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          A="../${{ matrix.name }}-${{ github.ref_name }}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = zip ]; then 7z a -tzip "$A" Norrblock; else tar czf "$A" Norrblock; fi
      - name: Upload archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.name }}-*.${{ matrix.ext }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz
            SHA256SUMS.txt
