name: Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Les shaders SPIR-V sont versionnés (crates/nb-gfx/shaders/spv) : pas besoin de glslc.
      - name: Build release
        run: cargo build --locked --release -p nb-app
      - name: Package
        shell: bash
        run: sh scripts/package.sh target/release/norrblock.exe dist/Norrblock
      - uses: actions/upload-artifact@v4
        with:
          name: Norrblock-windows
          path: dist/Norrblock
          if-no-files-found: error
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/Norrblock -DestinationPath Norrblock-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Norrblock-windows.zip
